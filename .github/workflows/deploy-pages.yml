# Builds the web app and publishes the download site to GitHub Pages on every push to main.
#   https://<user>.github.io/<repo>/        -> download page (site/)
#   https://<user>.github.io/<repo>/app/    -> the web app itself
#   https://<user>.github.io/<repo>/GK-Fitness.apk
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Assemble site
        run: |
          set -e
          mkdir -p _site/app
          cp -r site/. _site/
          cp -r dist/. _site/app/
          cp GK-Fitness.apk _site/GK-Fitness.apk
          SIZE=$(python3 -c "import os; print(f'{os.path.getsize(\"GK-Fitness.apk\")/1048576:.1f} MB')")
          VER=$(grep -oP "VERSION_NAME = \d+, '\K[^']+" android/build_apk.py || echo "latest")
          sed -i "s/__APK_SIZE__/${SIZE}/g; s/__APK_VERSION__/${VER}/g" _site/index.html
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
